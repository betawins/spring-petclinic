title = "Custom Company Secret Rules"


[[rules]]
id = "generic-password"
description = "Detect hardcoded generic passwords"

regex = '''(?i)(password|passwd|pwd)\s*[:=]\s*['"]?[A-Za-z0-9@#$%^&*()_+\-]{4,}'''

tags = ["password"]

[[rules.allowlists]]
paths = [
    '''docker-compose\.yml''',
    '''README\.md''',
    '''mvnw'''
]


[[rules]]
id = "generic-secret"
description = "Detect hardcoded secrets and tokens"

regex = '''(?i)(secret|token|apikey|api_key|access_key)\s*[:=]\s*['"]?[A-Za-z0-9_\-@#$%^&+=/]{5,}'''

tags = ["secret"]


[[rules]]
id = "database-credentials"
description = "Detect hardcoded database credentials"

regex = '''(?i)(db.username|db.password|spring.datasource.password)\s*[:=]\s*.+'''

tags = ["database"]

[[rules.allowlists]]
paths = [
    '''src/main/resources/application-mysql\.properties''',
    '''src/main/resources/application-postgres\.properties'''
]
